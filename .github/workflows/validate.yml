name: Architecture & Documentation Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Architecture Rules
        run: |
          chmod +x scripts/validate-arch.sh
          bash scripts/validate-arch.sh

      - name: Verify Documentation Consistency
        run: |
          chmod +x scripts/sync-docs.sh
          bash scripts/sync-docs.sh
